[package]
name = "game-sim"
description = "Your port of the game's simulation: bit-exact, headless, no engine"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
# our own crate (FIZL0/ps2-float), pinned by tag: fix it there, release, bump here (AGENT.md)
ps2-float = { git = "https://github.com/FIZL0/ps2-float", tag = "v0.3.0" }

[dev-dependencies]
# The oracle is a *test* dependency: the shipped sim must not need the disc at runtime.
kit-oracle = { path = "../kit-oracle" }
