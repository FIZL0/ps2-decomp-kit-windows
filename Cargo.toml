# The Rust side of ps2-decomp-kit: the PS2's arithmetic, the function oracle, and your port.
#
#   crates/kit-oracle  the function oracle wired to kit.toml: calls the original game's own functions (test-only)
#   crates/game-sim    your port: a skeleton to fill in
#
# The PS2's arithmetic (FIZL0/ps2-float) and the R5900 interpreter (FIZL0/ps2-oracle) are our own
# libraries in their own repositories, pulled in as tag-pinned git dependencies (nothing from crates.io).
# Fix or extend them there, tag a release, and bump the tags here: see AGENT.md.
#
# `cargo test --workspace` works with no disc present: everything that needs the game's code skips
# with a message naming what is missing.
[workspace]
resolver = "3"
members = ["crates/kit-oracle", "crates/game-sim"]

[workspace.package]
edition = "2024"
version = "1.0.0"
publish = false

# Small, release-speed tests: an oracle run is tens of thousands of interpreted calls, which is
# minutes in a debug build and seconds here.
[profile.test]
opt-level = 2

[profile.dev]
opt-level = 1
